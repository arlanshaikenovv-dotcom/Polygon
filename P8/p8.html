<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Солнечная система</title>
  <link rel="stylesheet" href="p8.css">
</head>
<body>

  <div class="space">
    <!-- Солнце -->
    <div class="sun"></div>

    <!-- Орбиты и планеты -->
    <div class="orbit mercury-orbit">
      <div class="planet mercury" title="Меркурий"></div>
    </div>

    <div class="orbit venus-orbit">
      <div class="planet venus" title="Венера"></div>
    </div>

    <div class="orbit earth-orbit">
      <div class="planet earth" title="Земля"></div>
    </div>

    <div class="orbit mars-orbit">
      <div class="planet mars" title="Марс"></div>
    </div>

    <div class="orbit jupiter-orbit">
      <div class="planet jupiter" title="Юпитер"></div>
    </div>

    <div class="orbit saturn-orbit">
      <div class="planet saturn" title="Сатурн">
        <div class="saturn-ring"></div>
      </div>
    </div>

    <div class="orbit uranus-orbit">
      <div class="planet uranus" title="Уран"></div>
    </div>

    <div class="orbit neptune-orbit">
      <div class="planet neptune" title="Нептун"></div>
    </div>
  </div>

</body>
</html>
